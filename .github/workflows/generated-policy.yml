name: Generated source policy

on:
  pull_request:
    paths:
      - "generated/**"
      - "lib/src/env/generated.dart"
      - "contracts/**"
      - ".cli-flags.toml"
      - ".gitattributes"
      - "scripts/freeze-generated.sh"
      - ".github/workflows/generated-policy.yml"
  push:
    branches:
      - main
    paths:
      - "generated/**"
      - "lib/src/env/generated.dart"
      - "contracts/**"
      - ".cli-flags.toml"
      - ".gitattributes"
      - "scripts/freeze-generated.sh"
      - ".github/workflows/generated-policy.yml"

permissions:
  contents: read

jobs:
  generated-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate generated-source ownership
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          test -f generated/readme.md || { echo "::error::generated/readme.md is required"; exit 1; }
          grep -Fq 'generated/** linguist-generated=true' .gitattributes || {
            echo "::error::.gitattributes must classify generated/** as generated"
            exit 1
          }
          grep -Fq 'lib/src/env/generated.dart linguist-generated=true' .gitattributes || {
            echo "::error::.gitattributes must classify lib/src/env/generated.dart as generated"
            exit 1
          }

          for path in generated/dart/env.dart generated/dart/runtime.dart; do
            head -n 1 "$path" | grep -Fq 'Generated by flags-2-env from .cli-flags.toml. Do not edit.' || {
              echo "::error::$path is missing its generator provenance header"
              exit 1
            }
          done
          for path in generated/json-schema/*.json; do
            grep -Fq '"x-flags-2-env"' "$path" || {
              echo "::error::$path is missing flags-2-env provenance"
              exit 1
            }
          done

          bad_modes="$(git ls-files --stage generated lib/src/env/generated.dart | awk '$1 != "100644" {print}')"
          if [[ -n "$bad_modes" ]]; then
            echo "::error::generated files must be regular, non-executable Git entries (100644)"
            printf '%s\n' "$bad_modes"
            exit 1
          fi

          bash scripts/freeze-generated.sh .
          if find generated -mindepth 1 ! -path generated/readme.md -perm /222 -print -quit | grep -q .; then
            echo "::error::failed to make generated derivatives read-only in this checkout"
            exit 1
          fi
          if [[ -w lib/src/env/generated.dart ]]; then
            echo "::error::failed to make lib/src/env/generated.dart read-only"
            exit 1
          fi

          if [[ -z "${BASE_SHA:-}" ]]; then exit 0; fi

          mapfile -t changed < <(git diff --name-only "${BASE_SHA}...HEAD")
          output_changed="$(printf '%s\n' "${changed[@]}" | grep -E '^(generated/|lib/src/env/generated\.dart$)' | grep -Ev '^generated/(readme|README)\.md$' || true)"
          cli_changed="$(printf '%s\n' "${changed[@]}" | grep -Fx '.cli-flags.toml' || true)"
          config_changed="$(printf '%s\n' "$output_changed" | grep -E '^(generated/(dart|json-schema)/|lib/src/env/generated\.dart$)' || true)"
          contract_changed="$(printf '%s\n' "$output_changed" | grep -Ev '^(generated/(dart|json-schema)/|lib/src/env/generated\.dart$)' || true)"

          if [[ -n "$cli_changed" && -z "$config_changed" ]]; then
            echo "::error::.cli-flags.toml changed without regenerated Dart/schema projections"
            exit 1
          fi
          if [[ -n "$config_changed" && -z "$cli_changed" ]]; then
            echo "::error::flags-2-env projections changed without their .cli-flags.toml authority"
            exit 1
          fi

          if [[ -z "$contract_changed" ]]; then exit 0; fi

          typespec_changed="$(printf '%s\n' "${changed[@]}" | grep -E '^contracts/typespec/.*\.tsp$' || true)"
          json_changed="$(printf '%s\n' "${changed[@]}" | grep -E '^contracts/(json-schema|openapi)/.*\.(json|ya?ml)$' || true)"
          parity_changed="$(printf '%s\n' "${changed[@]}" | grep -E '^contracts/parity/.*\.json$' || true)"

          [[ -n "$typespec_changed" ]] || { echo "::error::semantic generated output requires a human-authored TypeSpec authority change"; exit 1; }
          [[ -n "$json_changed" ]] || { echo "::error::semantic generated output requires a peer JSON Schema/OpenAPI authority change"; exit 1; }
          [[ -n "$parity_changed" ]] || { echo "::error::semantic generated output requires a machine-readable parity receipt"; exit 1; }
