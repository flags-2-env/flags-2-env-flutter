# flags-2-env surface for the Flutter client.
[identity]
service = "flags-2-env-flutter"
type_name = "FlutterEnv"

[env]
files = [".env"]
load = true

[flags.api_base]
env = "FLAGS_2_ENV_API_BASE"
type = "string"
default = "http://127.0.0.1:8080"
examples = ["http://127.0.0.1:8080", "https://api.flags2env.example"]
help = "API HTTP base URL."
